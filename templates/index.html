<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نتائج البطولة - سباق Concept2</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
    margin: 0; padding: 0; color: #e2e8f0; min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #1d4ed8 0%, #7c3aed 100%);
    padding: 28px 20px 22px; text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .header h1 { margin: 0 0 6px; font-size: 22px; font-weight: 800; color: #fff; }
  .header .subtitle { color: rgba(255,255,255,0.85); font-size: 12px; }
  .container { max-width: 900px; margin: 0 auto; padding: 18px 14px 50px; }

  .section-title {
    font-size: 16px; font-weight: 800; color: #f1f5f9;
    margin: 26px 0 12px; display: flex; align-items: center; gap: 8px;
  }
  .section-title.first { margin-top: 0; }

  .standings-list { display: flex; flex-direction: column; gap: 6px; }
  .standing-row {
    display: flex; align-items: center; gap: 12px;
    background: #1e293b; border: 1px solid #334155; border-radius: 10px;
    padding: 10px 14px;
  }
  .standing-row.r1 { border-color: #eab308; background: linear-gradient(90deg, rgba(234,179,8,0.15), #1e293b); }
  .standing-row.r2 { border-color: #94a3b8; }
  .standing-row.r3 { border-color: #d97706; }
  .s-rank { min-width: 26px; font-weight: 800; color: #94a3b8; font-size: 14px; }
  .r1 .s-rank { color: #eab308; }
  .s-club { flex: 1; font-weight: 700; font-size: 14px; color: #f1f5f9; }
  .s-points { font-weight: 800; font-size: 15px; color: #4ade80; }

  .race-card {
    background: #1e293b; border: 1px solid #334155; border-radius: 12px;
    margin-bottom: 12px; overflow: hidden;
  }
  .race-header {
    padding: 10px 14px; background: #273449; font-weight: 700; font-size: 13px;
    color: #93c5fd; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
  }
  .race-body { padding: 6px 10px 10px; }
  .race-body.collapsed { display: none; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { padding: 6px 6px; text-align: right; }
  th { color: #64748b; font-weight: 600; font-size: 11px; border-bottom: 1px solid #334155; }
  td { border-bottom: 1px solid #263548; }
  td:last-child, th:last-child { text-align: left; font-weight: 700; color: #4ade80; }
  tr.medal1 td { color: #eab308; }
  tr.medal2 td { color: #cbd5e1; }
  tr.medal3 td { color: #d97706; }

  .clubs-status { margin-top: 24px; padding-top: 16px; border-top: 1px solid #334155; }
  .clubs-status h3 { font-size: 13px; color: #94a3b8; margin: 0 0 10px; font-weight: 600; }
  .clubs { display: flex; flex-wrap: wrap; gap: 6px; }
  .club-badge { padding: 5px 11px; border-radius: 20px; font-size: 11px; font-weight: 600; background: #334155; color: #cbd5e1; }
  .club-badge.ok { background: rgba(74,222,128,0.15); color: #4ade80; }
  .club-badge.err { background: rgba(248,113,113,0.15); color: #f87171; }

  .empty { text-align: center; padding: 40px 20px; color: #64748b; }
  button#refreshBtn {
    background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff; border: none;
    padding: 8px 16px; border-radius: 10px; font-weight: 700; font-size: 13px;
  }
</style>
</head>
<body>
  <div class="header">
    <h1>🏁 نتائج البطولة</h1>
    <div class="subtitle" id="updated">جاري التحميل...</div>
  </div>

  <div class="container">
    <div style="text-align:left; margin-bottom:10px;">
      <button id="refreshBtn">↻ تحديث</button>
    </div>

    <div class="section-title first">🏆 الترتيب العام للأندية</div>
    <div class="standings-list" id="standingsList"></div>

    <div class="section-title">📋 نتائج السباقات حسب الفئة</div>
    <div id="racesList"></div>
    <div id="emptyMsg" class="empty" style="display:none;">لا توجد نتائج بعد</div>

    <div class="clubs-status">
      <h3>حالة الأندية</h3>
      <div class="clubs" id="clubs"></div>
    </div>
  </div>

<script>
function medalClass(place) {
  if (place === 1) return 'medal1';
  if (place === 2) return 'medal2';
  if (place === 3) return 'medal3';
  return '';
}

function rankClass(rank) {
  if (rank === 1) return 'r1';
  if (rank === 2) return 'r2';
  if (rank === 3) return 'r3';
  return '';
}

async function refresh() {
  const res = await fetch('/api/results');
  const data = await res.json();

  document.getElementById('updated').textContent = data.updated_at ? ('آخر تحديث: ' + data.updated_at) : 'جاري التحميل الأول...';

  const standingsList = document.getElementById('standingsList');
  if (!data.standings.length) {
    standingsList.innerHTML = '<div class="empty">لا يوجد ترتيب بعد</div>';
  } else {
    standingsList.innerHTML = data.standings.map(s => `
      <div class="standing-row ${rankClass(s.rank)}">
        <div class="s-rank">${s.rank}</div>
        <div class="s-club">${s.club}</div>
        <div class="s-points">${s.points} نقطة</div>
      </div>`).join('');
  }

  const racesList = document.getElementById('racesList');
  const emptyMsg = document.getElementById('emptyMsg');
  if (!data.races.length) {
    racesList.innerHTML = '';
    emptyMsg.style.display = 'block';
  } else {
    emptyMsg.style.display = 'none';
    racesList.innerHTML = data.races.map((race, idx) => `
      <div class="race-card">
        <div class="race-header" onclick="toggleRace(${idx})">
          <span>${race.category}</span>
          <span id="arrow-${idx}">▾</span>
        </div>
        <div class="race-body" id="race-${idx}">
          <table>
            <thead><tr><th>#</th><th>الاسم</th><th>النادي</th><th>النتيجة</th><th>نقاط</th></tr></thead>
            <tbody>
              ${race.results.map(r => `
                <tr class="${medalClass(r.place)}">
                  <td>${r.place}</td>
                  <td>${r.participant || '-'}</td>
                  <td>${r.club || '-'}</td>
                  <td>${r.score || '-'}</td>
                  <td>${r.points}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>`).join('');
  }

  const clubsEl = document.getElementById('clubs');
  clubsEl.innerHTML = data.clubs.map(c => {
    const cls = c.statut === 'ok' ? 'ok' : (c.statut === 'non configuré' ? '' : 'err');
    return `<span class="club-badge ${cls}">${c.nom}: ${c.statut === 'ok' ? c.nb + ' نتيجة' : c.statut}</span>`;
  }).join('');
}

function toggleRace(idx) {
  const body = document.getElementById('race-' + idx);
  const arrow = document.getElementById('arrow-' + idx);
  body.classList.toggle('collapsed');
  arrow.textContent = body.classList.contains('collapsed') ? '▸' : '▾';
}

document.getElementById('refreshBtn').addEventListener('click', refresh);
refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
