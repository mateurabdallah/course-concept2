<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الترتيب الموحد - سباق Concept2</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
    margin: 0;
    padding: 0;
    color: #e2e8f0;
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #1d4ed8 0%, #7c3aed 100%);
    padding: 28px 20px 24px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .header h1 {
    margin: 0 0 6px;
    font-size: 24px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.5px;
  }
  .header .subtitle {
    color: rgba(255,255,255,0.85);
    font-size: 13px;
  }
  .container { max-width: 900px; margin: 0 auto; padding: 18px 14px 40px; }

  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
    position: sticky;
    top: 0;
    z-index: 10;
    background: #0f172a;
    padding: 10px 0;
  }
  select, button {
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid #334155;
    font-size: 14px;
    background: #1e293b;
    color: #e2e8f0;
    font-weight: 600;
  }
  select { flex: 1; }
  button#refreshBtn {
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: #fff;
    border: none;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  button#refreshBtn:active { transform: scale(0.97); }

  .card-list { display: flex; flex-direction: column; gap: 8px; }
  .row-card {
    background: #1e293b;
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1px solid #334155;
    transition: transform 0.15s;
  }
  .row-card.top1 { border-color: #eab308; background: linear-gradient(90deg, rgba(234,179,8,0.15), #1e293b); }
  .row-card.top2 { border-color: #94a3b8; background: linear-gradient(90deg, rgba(148,163,184,0.15), #1e293b); }
  .row-card.top3 { border-color: #d97706; background: linear-gradient(90deg, rgba(217,119,6,0.15), #1e293b); }

  .rank {
    min-width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #334155;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 14px;
    color: #cbd5e1;
    flex-shrink: 0;
  }
  .top1 .rank { background: #eab308; color: #1e293b; }
  .top2 .rank { background: #94a3b8; color: #1e293b; }
  .top3 .rank { background: #d97706; color: #1e293b; }

  .info { flex: 1; min-width: 0; }
  .name { font-weight: 700; font-size: 15px; color: #f1f5f9; }
  .meta { font-size: 12px; color: #94a3b8; margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
  .meta .club { color: #60a5fa; font-weight: 600; }
  .meta .cat { background: #334155; padding: 1px 8px; border-radius: 6px; }

  .score { font-weight: 800; font-size: 16px; color: #4ade80; white-space: nowrap; }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: #64748b;
  }
  .empty .icon { font-size: 40px; margin-bottom: 10px; }

  .clubs-status {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid #334155;
  }
  .clubs-status h3 { font-size: 13px; color: #94a3b8; margin: 0 0 10px; font-weight: 600; }
  .clubs { display: flex; flex-wrap: wrap; gap: 6px; }
  .club-badge {
    padding: 5px 11px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    background: #334155;
    color: #cbd5e1;
  }
  .club-badge.ok { background: rgba(74,222,128,0.15); color: #4ade80; }
  .club-badge.err { background: rgba(248,113,113,0.15); color: #f87171; }

  .updated-bar {
    font-size: 12px;
    color: #64748b;
    text-align: center;
    margin-top: 10px;
  }
  .pulse { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #4ade80; margin-left: 5px; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
</style>
</head>
<body>
  <div class="header">
    <h1>🏁 الترتيب الموحد للسباق</h1>
    <div class="subtitle" id="updated">جاري التحميل...</div>
  </div>

  <div class="container">
    <div class="controls">
      <select id="categoryFilter"><option value="__all__">كل الفئات</option></select>
      <button id="refreshBtn">↻ تحديث</button>
    </div>

    <div class="card-list" id="cardList"></div>
    <div id="emptyMsg" class="empty" style="display:none;">
      <div class="icon">🚣</div>
      لا توجد نتائج بعد<br>
      <span style="font-size:12px;">تأكد من إعداد روابط الأندية</span>
    </div>

    <div class="clubs-status">
      <h3>حالة الأندية</h3>
      <div class="clubs" id="clubs"></div>
    </div>
  </div>

<script>
let lastCategory = "__all__";

function medalRank(i) {
  if (i === 0) return "top1";
  if (i === 1) return "top2";
  if (i === 2) return "top3";
  return "";
}

async function refresh() {
  const res = await fetch('/api/results');
  const data = await res.json();

  const updatedEl = document.getElementById('updated');
  updatedEl.innerHTML = data.updated_at
    ? ('آخر تحديث: ' + data.updated_at + '<span class="pulse"></span>')
    : 'جاري التحميل الأول...';

  const catSelect = document.getElementById('categoryFilter');
  const current = catSelect.value || lastCategory;
  catSelect.innerHTML = '<option value="__all__">كل الفئات</option>' +
    data.categories.map(c => `<option value="${c}">${c}</option>`).join('');
  if ([...catSelect.options].some(o => o.value === current)) catSelect.value = current;
  lastCategory = catSelect.value;

  let rows = data.rows;
  if (lastCategory !== '__all__') rows = rows.filter(r => r.category === lastCategory);

  const cardList = document.getElementById('cardList');
  const emptyMsg = document.getElementById('emptyMsg');
  if (!rows.length) {
    cardList.innerHTML = '';
    emptyMsg.style.display = 'block';
  } else {
    emptyMsg.style.display = 'none';
    cardList.innerHTML = rows.map((r, i) => `
      <div class="row-card ${medalRank(i)}">
        <div class="rank">${i + 1}</div>
        <div class="info">
          <div class="name">${r.participant || '-'}</div>
          <div class="meta">
            <span class="club">${r.club || '-'}</span>
            ${r.category ? `<span class="cat">${r.category}</span>` : ''}
          </div>
        </div>
        <div class="score">${r.score || '-'}</div>
      </div>`).join('');
  }

  const clubsEl = document.getElementById('clubs');
  clubsEl.innerHTML = data.clubs.map(c => {
    const cls = c.statut === 'ok' ? 'ok' : (c.statut === 'non configuré' ? '' : 'err');
    return `<span class="club-badge ${cls}">${c.nom}: ${c.statut === 'ok' ? c.nb + ' نتيجة' : c.statut}</span>`;
  }).join('');
}

document.getElementById('categoryFilter').addEventListener('change', refresh);
document.getElementById('refreshBtn').addEventListener('click', refresh);

refresh();
setInterval(refresh, 15000);
</script>
</body>
