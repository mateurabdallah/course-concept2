<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قوائم الانطلاق</title>
    <style>
        body { font-family: system-ui, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        button { background-color: #10b981; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:disabled { background-color: #64748b; cursor: not-allowed; }
        input[type="file"] { background: #334155; padding: 10px; border-radius: 6px; color: white; margin-bottom: 10px; }
        .btn-danger { background-color: #ef4444; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 قوائم الانطلاق</h1>
        <a href="/" style="color: #38bdf8; text-decoration: none;">← رجوع للترتيب العام</a>

        <div class="card" style="margin-top: 20px;">
            <h3>ارفع ملفات Excel (فيش الانخراط) لكل نادي</h3>
            <input type="file" id="fileInput" multiple accept=".xlsx, .xls">
            <br><br>
            <button id="uploadBtn">⬆️ رفع الملفات</button>
        </div>

        <div class="card">
            <button id="clearBtn" class="btn-danger">🗑️ مسح الكل</button>
            <p>عدد الملفات: <span id="fileCount">0</span> — عدد المشاركات: <span id="entryCount">0</span></p>
        </div>

        <div id="racesList"></div>
    </div>

    <script>
        async function loadData() {
            try {
                const res = await fetch('/api/startlist/data');
                if (!res.ok) return;
                const data = await res.json();
                
                document.getElementById('fileCount').textContent = data.files ? data.files.length : 0;
                document.getElementById('entryCount').textContent = data.total_entries || 0;

                const racesList = document.getElementById('racesList');
                if (!data.races || data.races.length === 0) {
                    racesList.innerHTML = '<p>لا توجد قوائم بعد — ارفع الملفات فوق</p>';
                    return;
                }

                racesList.innerHTML = data.races.map(race => `
                    <div class="card" style="text-align: right;">
                        <h3>الفئة: ${race.category} (${race.entries.length})</h3>
                        <ul>
                            ${race.entries.map(e => `<li><b>${e.participant}</b> - ${e.club}</li>`).join('')}
                        </ul>
                    </div>
                `).join('');
            } catch (err) {
                console.log("جاري استدعاء البيانات...");
            }
        }

        document.getElementById('uploadBtn').addEventListener('click', async () => {
            const input = document.getElementById('fileInput');
            if (!input.files.length) { 
                alert('اختر ملف واحد على الأقل'); 
                return; 
            }

            const formData = new FormData();
            for (const f of input.files) formData.append('files', f);

            const btn = document.getElementById('uploadBtn');
            btn.textContent = 'جاري الرفع...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/startlist/upload', { method: 'POST', body: formData });
                const result = await res.json();
                
                if (!res.ok) {
                    alert('خطأ من السيرفر: ' + (result.error || 'تعذر معالجة الطلب'));
                } else {
                    input.value = '';
                    loadData();
                }
            } catch (err) {
                alert('تعذر الاتصال بالسيرفر. يرجى انتظار دقيقة حتى ينتهي Render من إعادة البناء.');
            } finally {
                btn.textContent = '⬆️ رفع الملفات';
                btn.disabled = false;
            }
        });

        document.getElementById('clearBtn').addEventListener('click', async () => {
            if (confirm('هل أنت تأكد من مسح جميع القوائم؟')) {
                await fetch('/api/startlist/clear', { method: 'POST' });
                loadData();
            }
        });

        loadData();
    </script>
</body>
</html>
